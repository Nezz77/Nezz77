<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="145" viewBox="0 0 1200 145" role="img" aria-labelledby="title desc">
  <title id="title">Red and blue closing signal</title>
  <desc id="desc">The two light trails continue below the profile, then drift apart like the last frame of a hologram.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset="1" stop-color="#0c1426"/></linearGradient>
    <linearGradient id="red"><stop stop-color="#ff355e" stop-opacity="0"/><stop offset=".7" stop-color="#ff355e"/><stop offset="1" stop-color="#ffafbf"/></linearGradient>
    <linearGradient id="blue"><stop stop-color="#8ac0ff"/><stop offset=".3" stop-color="#3b82f6"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></linearGradient>
    <linearGradient id="rim"><stop stop-color="#ff355e"/><stop offset=".5" stop-color="#513288"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="clip"><path d="M0 0H1200V125Q1200 145 1180 145H20Q0 145 0 125Z"/></clipPath>
  </defs>
  <style>
    .run-red{stroke-dasharray:70 610;animation:travel-red 7s linear infinite}
    .run-blue{stroke-dasharray:70 610;animation:travel-blue 7s linear infinite}
    .core{animation:pulse 3.5s ease-in-out infinite}
    @keyframes travel-red{from{stroke-dashoffset:0}to{stroke-dashoffset:-620}}
    @keyframes travel-blue{from{stroke-dashoffset:620}to{stroke-dashoffset:0}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.run-red,.run-blue,.core{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="145" fill="url(#background)"/>
    <path d="M1 0V145M1199 0V145M0 144H1200" fill="none" stroke="url(#rim)" stroke-opacity=".8" stroke-width="2"/>
    <g fill="none" stroke="#344767" stroke-width="1">
      <path d="M0 48C146 48 180 112 300 112S445 61 562 97L600 115L638 97C755 61 780 112 900 112S1054 48 1200 48"/>
      <path d="M0 22C135 22 200 81 327 81S481 36 565 70L600 88L635 70C719 36 746 81 873 81S1065 22 1200 22"/>
    </g>
    <path d="M0 48C146 48 180 112 300 112S445 61 562 97L600 115" fill="none" stroke="url(#red)" stroke-width="2.5">
      <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0 48C146 48 180 112 300 112S445 61 562 97L600 115;M0 48C146 48 180 99 300 99S445 74 562 97L600 115;M0 48C146 48 180 112 300 112S445 61 562 97L600 115"/>
    </path>
    <path d="M600 115L638 97C755 61 780 112 900 112S1054 48 1200 48" fill="none" stroke="url(#blue)" stroke-width="2.5">
      <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M600 115L638 97C755 61 780 112 900 112S1054 48 1200 48;M600 115L638 97C755 74 780 99 900 99S1054 48 1200 48;M600 115L638 97C755 61 780 112 900 112S1054 48 1200 48"/>
    </path>
    <path class="run-red" d="M0 48C146 48 180 112 300 112S445 61 562 97L600 115" fill="none" stroke="#ff4b70" stroke-width="6" filter="url(#blur)"/>
    <path class="run-red" d="M0 48C146 48 180 112 300 112S445 61 562 97L600 115" fill="none" stroke="#ffe1e7" stroke-width="2"/>
    <path class="run-blue" d="M600 115L638 97C755 61 780 112 900 112S1054 48 1200 48" fill="none" stroke="#3b82f6" stroke-width="6" filter="url(#blur)"/>
    <path class="run-blue" d="M600 115L638 97C755 61 780 112 900 112S1054 48 1200 48" fill="none" stroke="#d5e9ff" stroke-width="2"/>
    <path d="M600 96L619 115L600 134L581 115Z" fill="#111629" stroke="url(#rim)" stroke-width="2"/>
    <path class="core" d="M600 106L609 115L600 124L591 115Z" fill="#a77ad9"/>
    <text x="600" y="54" text-anchor="middle" fill="#a2b4d1" font-family="Courier New,monospace" font-size="13" letter-spacing="4">END OF PAGE · START OF SOMETHING NEW</text>
  </g>
</svg>
