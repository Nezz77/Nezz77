<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="title desc">
  <title id="title">Red and blue opening signal</title>
  <desc id="desc">Two moving light trails meet at a small central aperture above the profile portrait.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset="1" stop-color="#0c1426"/></linearGradient>
    <linearGradient id="red" x2="1"><stop stop-color="#ff355e" stop-opacity="0"/><stop offset=".6" stop-color="#ff355e" stop-opacity=".9"/><stop offset="1" stop-color="#ff9cab"/></linearGradient>
    <linearGradient id="blue" x2="1"><stop stop-color="#8ac0ff"/><stop offset=".4" stop-color="#3b82f6" stop-opacity=".9"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></linearGradient>
    <linearGradient id="rim"><stop stop-color="#ff355e"/><stop offset=".5" stop-color="#492d7f"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <radialGradient id="haze"><stop stop-color="#3b82f6" stop-opacity=".17"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="clip"><path d="M20 0H1180Q1200 0 1200 20V130H0V20Q0 0 20 0Z"/></clipPath>
  </defs>
  <style>
    .red-run{stroke-dasharray:70 610;animation:travel-red 6.5s linear infinite}
    .blue-run{stroke-dasharray:70 610;animation:travel-blue 6.5s linear infinite}
    .diamond{animation:breath 3.2s ease-in-out infinite}
    @keyframes travel-red{from{stroke-dashoffset:620}to{stroke-dashoffset:0}}
    @keyframes travel-blue{from{stroke-dashoffset:0}to{stroke-dashoffset:-620}}
    @keyframes breath{0%,100%{opacity:.5}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.red-run,.blue-run,.diamond{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="130" fill="url(#background)"/>
    <ellipse cx="590" cy="30" rx="340" ry="140" fill="url(#haze)"/>
    <path d="M0 1H1200" stroke="url(#rim)" stroke-width="3"/>
    <path d="M1 0V130M1199 0V130" stroke="url(#rim)" stroke-opacity=".72" stroke-width="2"/>
    <g fill="none" stroke="#3e5374" stroke-opacity=".6" stroke-width="1">
      <path d="M0 91C132 91 164 36 291 36S440 94 560 53L600 34L640 53C760 94 789 36 909 36S1068 91 1200 91"/>
      <path d="M0 112C153 112 199 71 320 71S472 114 565 84L600 66L635 84C728 114 759 71 880 71S1047 112 1200 112"/>
    </g>
    <path d="M0 91C132 91 164 36 291 36S440 94 560 53L600 34" fill="none" stroke="url(#red)" stroke-width="2.5">
      <animate attributeName="d" dur="6.5s" repeatCount="indefinite" values="M0 91C132 91 164 36 291 36S440 94 560 53L600 34;M0 91C132 91 177 47 291 47S440 83 560 53L600 34;M0 91C132 91 164 36 291 36S440 94 560 53L600 34"/>
    </path>
    <path d="M600 34L640 53C760 94 789 36 909 36S1068 91 1200 91" fill="none" stroke="url(#blue)" stroke-width="2.5">
      <animate attributeName="d" dur="6.5s" repeatCount="indefinite" values="M600 34L640 53C760 94 789 36 909 36S1068 91 1200 91;M600 34L640 53C760 83 789 47 909 47S1068 91 1200 91;M600 34L640 53C760 94 789 36 909 36S1068 91 1200 91"/>
    </path>
    <path class="red-run" d="M0 91C132 91 164 36 291 36S440 94 560 53L600 34" fill="none" stroke="#ff4b70" stroke-width="6" filter="url(#blur)"/>
    <path class="red-run" d="M0 91C132 91 164 36 291 36S440 94 560 53L600 34" fill="none" stroke="#ffd9e1" stroke-width="2"/>
    <path class="blue-run" d="M600 34L640 53C760 94 789 36 909 36S1068 91 1200 91" fill="none" stroke="#3b82f6" stroke-width="6" filter="url(#blur)"/>
    <path class="blue-run" d="M600 34L640 53C760 94 789 36 909 36S1068 91 1200 91" fill="none" stroke="#cce4ff" stroke-width="2"/>
    <path d="M600 16L618 34L600 52L582 34Z" fill="#0d1424" stroke="url(#rim)" stroke-width="2"/>
    <path class="diamond" d="M600 25L609 34L600 43L591 34Z" fill="#9d65ce"/>
    <g fill="#8ca4cb" font-family="Courier New,monospace" font-size="10" letter-spacing="3">
      <text x="34" y="118">ALWAYS EXPLORING</text>
      <text x="1023" y="118">NEZZ77 / 01</text>
    </g>
  </g>
</svg>
