name: Refresh contribution snake

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate red and blue contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF355E&color_dots=#E8EEF7,#BFDBFE,#93C5FD,#3B82F6,#1D4ED8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF355E&color_dots=#151C2C,#172554,#1D4ED8,#3B82F6,#93C5FD

      - name: Publish the snake images to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
